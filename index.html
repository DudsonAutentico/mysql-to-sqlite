<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Przetłumacz MySQL na SQLite</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styl.css">
</head>
<body>
    <header>
        <div class="toggle">
            <input type="checkbox" id="theme-toggle">
            <label for="theme-toggle"></label>
        </div>
        <h1 id="naglowek">
            <img id="logo" src="favicon.svg" width="64px">
            Przetłumacz MySQL na SQLite
        </h1>    
    </header>
    <div id="sekcje">
        <section id="lewy">
            <h3>MySQL</h3>
            <textarea class="pole_tekstowe" id="mysql" placeholder="Wklej (Ctrl+V) lub wpisz tutaj swoje zapytanie w MySQL."></textarea>
            <button type="button" id="btn-tlumacz">Przetłumacz</button>
        </section>
        <section id="prawy">
            <h3>SQLite</h3>
            <textarea class="pole_tekstowe" id="sqlite" readonly placeholder="Tutaj pojawi się wynik w SQLite."></textarea>
            <button type="button" id="btn-kopiuj" style="visibility: hidden;">Kopiuj</button>
        </section>
    </div>
    <footer>
    <div class="footer-content">
        <span><strong>&copy; Adam Dudek</strong></span>
    </div>
</footer>

    </div>

</body>
</html>
